<div class="demo">
  <h2>Nav Toggle — Slide Panel</h2>
  <p class="desc">A full-screen nav panel width-wipes open from a hamburger trigger, and unmounts its decorative background only after the close transition finishes.</p>

  <div class="stage">
    <div class="topbar">
      <span class="logo">Site</span>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
    <nav class="panel" id="panel">
      <div class="panel-bg" id="panelBg" hidden></div>
      <ul class="links">
        <li>Home</li>
        <li>Work</li>
        <li>About</li>
        <li>Contact</li>
      </ul>
    </nav>
  </div>
</div>
