<div class="demo">
  <h2>Slider Pane Transition</h2>
  <p>Directional slide carousel — panes enter/exit vertically, pagination dots slide to re-center on the active dot.</p>

  <div class="slider" id="slider">
    <div class="slider-viewport" id="viewport">
      <!-- panes injected by script.js -->
    </div>

    <button class="arrow arrow-prev" id="prevBtn" aria-label="Previous slide">&#8592;</button>
    <button class="arrow arrow-next" id="nextBtn" aria-label="Next slide">&#8594;</button>
  </div>

  <div class="dots-track-wrap">
    <div class="dots-track" id="dotsTrack">
      <!-- dots injected by script.js -->
    </div>
  </div>
</div>
