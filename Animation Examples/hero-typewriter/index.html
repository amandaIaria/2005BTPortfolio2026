<div class="demo">
  <h2>Hero Typewriter</h2>
  <p class="desc">Character-by-character reveal: name types, pauses, then heading and caption type in stages. Supports an <code>&lt;accent&gt;</code> markup for colored spans.</p>

  <div class="stage">
    <div class="hero" id="hero">
      <div class="hero-name" id="hero-name"></div>
      <div class="hero-heading" id="hero-heading"></div>
      <div class="hero-caption" id="hero-caption"></div>
    </div>
  </div>

  <button class="replay-btn" id="replay">Replay</button>
</div>
