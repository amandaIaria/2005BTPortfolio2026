<div class="demo">
  <h2>Modal Fade + Zoom</h2>
  <p>Dialog content fades and zooms in/out over the backdrop. Click outside or press Escape to close.</p>

  <button class="open-btn" id="openBtn">Open modal</button>

  <div class="backdrop" id="backdrop">
    <div class="modal" id="modal" role="dialog" aria-modal="true">
      <h3>Confirm action</h3>
      <p>This modal fades and scales in from 95% to 100%, and reverses on close.</p>
      <div class="modal-actions">
        <button class="btn-ghost" id="closeBtn">Cancel</button>
        <button class="btn-solid" id="confirmBtn">Confirm</button>
      </div>
    </div>
  </div>
</div>
