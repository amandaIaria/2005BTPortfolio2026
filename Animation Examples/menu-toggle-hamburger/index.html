<div class="demo">
  <h2>Menu Toggle — Hamburger ↔ X</h2>
  <p class="desc">Three lines animate translateY, rotate, and opacity to morph a hamburger icon into a close (X) icon.</p>

  <button class="toggle" id="toggle" aria-label="Toggle menu">
    <span class="line line-top"></span>
    <span class="line line-mid"></span>
    <span class="line line-bottom"></span>
  </button>
</div>
