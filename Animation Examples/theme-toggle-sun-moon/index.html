<div class="demo">
  <h2>Theme Toggle — Sun / Moon</h2>
  <p class="desc">Clicking swaps icons: the outgoing icon rotates and fades out before the incoming icon rotates and fades in — only one icon exists in the DOM at a time.</p>

  <button class="toggle" id="toggle" aria-label="Toggle theme">
    <span class="icon-wrap" id="iconWrap"></span>
  </button>
</div>
