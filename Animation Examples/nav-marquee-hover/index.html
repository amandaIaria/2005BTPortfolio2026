<div class="demo">
  <h2>Nav Marquee Hover</h2>
  <p class="desc">Hover a link: a duplicated copy of its label streams behind it in an infinite linear marquee, while the static label swaps from solid fill to an outline stroke.</p>

  <nav class="nav">
    <a href="#" class="nav-link">
      <span class="label">Work</span>
      <span class="marquee-track"><span class="marquee-item">Work</span><span class="marquee-item">Work</span></span>
    </a>
    <a href="#" class="nav-link">
      <span class="label">About</span>
      <span class="marquee-track"><span class="marquee-item">About</span><span class="marquee-item">About</span></span>
    </a>
    <a href="#" class="nav-link">
      <span class="label">Contact</span>
      <span class="marquee-track"><span class="marquee-item">Contact</span><span class="marquee-item">Contact</span></span>
    </a>
  </nav>
</div>
