[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 3000
  port = 8888
  autoLaunch = false

[images]
  remote_images = [
    'https://beautiful-tragedy\.com/\.netlify/functions/watermark.*'
  ]
